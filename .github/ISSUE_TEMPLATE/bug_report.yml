name: Bug 报告
description: 提交一个 bug，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢你花时间报告 bug！请尽量提供以下信息。"
  - type: input
    id: version
    attributes:
      label: 版本
      description: 你使用的版本（`python -m pojia --version`）
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "Windows 11 / macOS 14 / Ubuntu 22.04"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "3.11.9"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 如何触发这个 bug
      placeholder: "1. 运行命令 xxx\n2. 输入 xxx\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: "期望输出 xxx"
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: "实际输出了 xxx / 报错 xxx"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      placeholder: "截图、日志等"
