name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "感谢你的建议！请描述清楚你的想法。"
  - type: textarea
    id: problem
    attributes:
      label: 你的需求 / 想解决的问题
      placeholder: "描述你想做什么，或现在遇到的痛点"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      placeholder: "你希望这个项目如何满足这个需求？例如：新增一条 xxx 链路"
  - type: textarea
    id: example
    attributes:
      label: 使用示例（可选）
      placeholder: "给一个你期望的输入输出示例"
  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      placeholder: "参考资料、类似工具等"
